name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could POSTBote help? Examples of other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you tried
