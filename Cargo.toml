[workspace]
resolver = "3"
members = ["crates/postbote-core", "crates/postbote-server", "desktop"]
default-members = ["crates/postbote-core", "crates/postbote-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
