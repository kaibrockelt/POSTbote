[package]
name = "postbote-desktop"
description = "POSTBote desktop app (native window via the system webview)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "postbote-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
postbote-server = { path = "../crates/postbote-server" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
