[package]
name = "postbote-core"
description = "Collection format, request runner and scripting engine of postbote"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
rquickjs = "0.14"
reqwest = { version = "0.13", features = ["blocking", "cookies", "multipart", "form"] }
tokio = { version = "1", features = ["net"] }
csv = "1"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.9"
regex = "1"
url = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
